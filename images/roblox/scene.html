<!doctype html>
<html><body style="margin:0;background:transparent">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
// Wyrmhaven key art: the island in the game's faceted low-poly look, at the
// game's own scale (habitat platforms 16x16 studs, adult dragon 5.5 tall,
// baby 3.65, eggs 2 x 2.6 - HabitatDefs / DragonDefs). The two Fire dragons
// are the real in-game meshes, dumped from DragonBuilder (dragon-mesh/).
import * as THREE from 'three';

const C = (r, g, b) => new THREE.Color(r / 255, g / 255, b / 255);
const PLATFORM = { Fire: C(214, 121, 76), Water: C(94, 138, 168), Nature: C(107, 158, 110), Electric: C(196, 172, 90) };
const EGG = { Water: C(27, 90, 158), Nature: C(46, 125, 50), Electric: C(200, 150, 20), Dark: C(58, 36, 86), Light: C(220, 206, 160) };

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.85, metalness: 0,
  flatShading: true, emissive: o.glow ?? 0x000000, emissiveIntensity: o.gi ?? 1, side: o.side ?? THREE.FrontSide,
  vertexColors: !!o.vc, transparent: !!o.op, opacity: o.op ?? 1 });
function add(parent, geo, material, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(...pos); m.rotation.set(...rot); m.scale.set(...scale);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function jitter(geo, amount) { // facet a geometry a little, like hand-placed wedges
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amount, p.getY(i) + (rnd() - 0.5) * amount * 0.6, p.getZ(i) + (rnd() - 0.5) * amount);
  geo.computeVertexNormals(); return geo;
}

// ---------------------------------------------------------------- dragons
const DRAGONS = await (await fetch('dragon-mesh/fire_dragons.json')).json();
function dragon(stage) {
  const d = DRAGONS[stage];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(d.pos, 3));
  const col = [];
  for (let i = 0; i < d.col.length; i += 3) for (let k = 0; k < 3; k++) col.push(...[d.col[i], d.col[i + 1], d.col[i + 2]].map(c => Math.pow(c, 2.2)));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.7, side: THREE.DoubleSide }));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// ---------------------------------------------------------------- props
function rock(parent, pos, s, color = 0x8a8478) {
  return add(parent, jitter(new THREE.DodecahedronGeometry(1, 0), 0.35), mat(color), pos, [rnd() * 3, rnd() * 3, rnd() * 3], [s, s * 0.7, s]);
}
function tree(parent, pos, s = 1) {
  const g = new THREE.Group(); g.position.set(...pos); parent.add(g);
  add(g, new THREE.CylinderGeometry(0.35 * s, 0.5 * s, 3 * s, 6), mat(0x6b4a2e), [0, 1.5 * s, 0]);
  const greens = [0x3f9a3a, 0x4fb046, 0x358a34];
  add(g, jitter(new THREE.IcosahedronGeometry(2.2 * s, 0), 0.4 * s), mat(greens[Math.floor(rnd() * 3)]), [0, 4.3 * s, 0]);
  add(g, jitter(new THREE.IcosahedronGeometry(1.5 * s, 0), 0.3 * s), mat(greens[Math.floor(rnd() * 3)]), [0.9 * s, 5.6 * s, 0.3 * s]);
  return g;
}
function egg(parent, color, pos, tilt = 0) {
  const geo = new THREE.SphereGeometry(1, 8, 6);
  const p = geo.attributes.position; // pointier top, like the in-game egg
  for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) * (1 - Math.max(0, y) * 0.22)); p.setZ(i, p.getZ(i) * (1 - Math.max(0, y) * 0.22)); }
  geo.computeVertexNormals();
  const e = add(parent, geo, mat(color, { rough: 0.5 }), pos, [tilt, rnd() * 6, tilt * 0.5], [1, 1.3, 1]);
  // spots
  for (let k = 0; k < 4; k++) {
    const a = rnd() * Math.PI * 2, y = (rnd() - 0.3) * 0.9;
    add(e, new THREE.CircleGeometry(0.18, 6), mat(new THREE.Color(color).offsetHSL(0, 0, 0.18), { side: THREE.DoubleSide }),
      [Math.cos(a) * 0.93, y, Math.sin(a) * 0.93], [0, -a + Math.PI / 2, 0]);
  }
  return e;
}
function platform(parent, element, pos) {
  const g = new THREE.Group(); g.position.set(...pos); parent.add(g);
  const c = PLATFORM[element];
  add(g, new THREE.BoxGeometry(16.6, 1.2, 16.6), mat(c.clone().multiplyScalar(0.7)), [0, 0.4, 0]);
  add(g, new THREE.BoxGeometry(16, 1, 16), mat(c), [0, 0.6, 0]);
  return g;
}
function fireHabitat(parent, pos, volcano = true) {
  const g = platform(parent, 'Fire', pos);
  if (volcano) {
  const v = add(g, jitter(new THREE.ConeGeometry(4.2, 6.5, 7, 2), 0.5), mat(0x5a3a32), [-4.2, 4.3, 4.2]);
  add(g, new THREE.CylinderGeometry(1.5, 1.2, 0.5, 7), mat(0xff7a1a, { glow: 0xff5a00, gi: 1.6 }), [-4.2, 7.4, 4.2]);
  }
  for (const [x, z, s] of [[5.5, 5.5, 1.1], [6, -5, 0.8], [-6, -5.5, 0.9], [2, 6.4, 0.7]]) rock(g, [x, 1.6, z], s, 0x4a3530);
  // lava cracks on the platform
  for (const [x, z, r] of [[1, 2, 0.6], [-1.5, -3, -0.4], [4, -1, 0.2]]) add(g, new THREE.BoxGeometry(3.2, 0.06, 0.35), mat(0xff8a2a, { glow: 0xff5a00 }), [x, 1.12, z], [0, r, 0]);
  return g;
}
function waterHabitat(parent, pos) {
  const g = platform(parent, 'Water', pos);
  add(g, new THREE.CylinderGeometry(5.6, 5.6, 0.3, 9), mat(0x2f8fd6, { rough: 0.2, glow: 0x0a3a66, gi: 0.6 }), [0.5, 1.15, 0]);
  for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2; rock(g, [0.5 + Math.cos(a) * 6.1, 1.5, Math.sin(a) * 6.1], 0.9 + rnd() * 0.4, 0x9aa6ae); }
  return g;
}
function natureHabitat(parent, pos) {
  const g = platform(parent, 'Nature', pos);
  tree(g, [-4.5, 1.1, 4], 1.0); tree(g, [4.8, 1.1, 4.6], 0.8); tree(g, [-5, 1.1, -4.5], 0.75);
  for (let k = 0; k < 10; k++) add(g, new THREE.ConeGeometry(0.25, 0.9, 4), mat(0x5cc04a), [(rnd() - 0.5) * 13, 1.5, (rnd() - 0.5) * 13]);
  return g;
}
function electricHabitat(parent, pos) {
  const g = platform(parent, 'Electric', pos);
  for (const [x, z, h] of [[-4, 4, 6], [-2.5, 5.5, 4], [4.5, 4, 5], [5.5, -4.5, 3.5]])
    add(g, new THREE.OctahedronGeometry(1, 0), mat(0xffe14a, { rough: 0.3, glow: 0xb88a00, gi: 0.8 }), [x, 1.1 + h / 2, z], [0, rnd(), 0], [0.9, h / 2, 0.9]);
  return g;
}
function farm(parent, pos) {
  const g = new THREE.Group(); g.position.set(...pos); parent.add(g);
  add(g, new THREE.BoxGeometry(14, 0.6, 12), mat(0x7a5232), [0, 0.3, 0]);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
    add(g, new THREE.BoxGeometry(1.6, 0.35, 1.6), mat(0x5e3e24), [-5.5 + c * 2.2, 0.75, -3.6 + r * 2.4]);
    add(g, new THREE.ConeGeometry(0.55, 1.4, 5), mat(r % 2 ? 0x8ccf3c : 0xf2b632), [-5.5 + c * 2.2, 1.6, -3.6 + r * 2.4]);
  }
  return g;
}

// ---------------------------------------------------------------- island
function island(scene) {
  const g = new THREE.Group(); scene.add(g);
  const pts = []; const N = 22;
  for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2; const r = 78 + Math.sin(a * 3) * 8 + (rnd() - 0.5) * 9; pts.push(new THREE.Vector2(Math.cos(a) * r * 1.15, Math.sin(a) * r)); }
  const shape = new THREE.Shape(pts);
  const sandShape = new THREE.Shape(pts.map(p => p.clone().multiplyScalar(1.08)));
  const sand = add(g, new THREE.ExtrudeGeometry(sandShape, { depth: 3, bevelEnabled: false }), mat(0xe8d39a), [0, -2.2, 0], [Math.PI / 2, 0, 0]);
  const cliff = add(g, jitter(new THREE.ExtrudeGeometry(shape, { depth: 6, bevelEnabled: false, curveSegments: 1 }), 0.8), mat(0x9a8c76), [0, 0.0, 0], [Math.PI / 2, 0, 0]);
  const grass = add(g, new THREE.ShapeGeometry(shape), mat(0x6cbf4a), [0, 0.02, 0], [-Math.PI / 2, 0, 0], [0.97, 0.97, 1]);
  // a rocky hill at the back, like the reference island's peak
  add(g, jitter(new THREE.ConeGeometry(20, 19, 9, 3), 2.5), mat(0x8f8778), [-44, 9, 60]);
  add(g, jitter(new THREE.ConeGeometry(12, 13, 8, 2), 2), mat(0x7f786c), [-18, 6, 68]);
  return g;
}
function sea(scene) {
  const geo = new THREE.PlaneGeometry(1400, 1400, 70, 70);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, (rnd() - 0.5) * 1.2);
  geo.computeVertexNormals();
  add(scene, geo, mat(0x23a3c9, { rough: 0.35 }), [0, -1.4, 0], [-Math.PI / 2, 0, 0]);
  // lighter shallows around the beach
  add(scene, new THREE.CircleGeometry(115, 24), mat(0x52d0d8, { rough: 0.3, op: 0.55 }), [0, -0.9, 0], [-Math.PI / 2, 0, 0], [1.2, 1, 1]);
}

function sky(scene, top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d'); const gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); x.fillStyle = gr; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}

function world(o = {}) {
  seed = 7;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xbfe6f2, 160, 420);
  sea(scene); island(scene);
  fireHabitat(scene, [0, 0, 0], o.volcano !== false);
  waterHabitat(scene, o.far ? [-40, 0, 30] : [-26, 0, 10]);
  natureHabitat(scene, o.far ? [-30, 0, 60] : [-22, 0, 34]);
  electricHabitat(scene, o.far ? [20, 0, 50] : [6, 0, 30]);
  farm(scene, [30, 0, 22]);
  // nest with eggs of other elements
  const nest = new THREE.Group(); nest.position.set(...(o.nest || [22, 0, -6])); scene.add(nest);
  add(nest, new THREE.TorusGeometry(2.6, 0.9, 5, 9), mat(0xb08a52), [0, 0.6, 0], [Math.PI / 2, 0, 0]);
  egg(nest, EGG.Water, [-1.1, 1.8, 0.4], 0.15); egg(nest, EGG.Nature, [1.2, 1.8, 0.5], -0.2); egg(nest, EGG.Electric, [0, 1.8, -1.2], 0.1);
  for (const [x, z, s] of [[-50, -20, 1.1], [45, 48, 1.0], [52, -30, 0.9], [-60, 15, 1.2], [30, 55, 0.8], [-30, -40, 0.9], [62, 5, 0.8], [-8, 48, 0.9]]) tree(scene, [x, 0, z], s);
  for (const [x, z] of [[-45, -45], [66, -18], [12, -48], [-70, 0]]) rock(scene, [x, 0.8, z], 2.2);
  const lightGroup = new THREE.Group(); scene.add(lightGroup);
  scene.add(new THREE.HemisphereLight(0xdff4ff, 0x6b8a4a, 1.25));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
  sun.position.set(-60, 110, -70); sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 1, far: 400 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
  scene.add(sun);
  return scene;
}

function placeDragons(scene, adultPos, adultYaw, babyPos, babyYaw) {
  const a = dragon('Adult'); a.position.set(...adultPos); a.rotation.y = adultYaw; scene.add(a);
  if (babyPos) { const b = dragon('Baby'); b.position.set(...babyPos); b.rotation.y = babyYaw; scene.add(b); }
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

window.SHOTS = {
  // 16:9 thumbnail: the Fire habitat with its two dragons up front, the rest of the island behind.
  Thumbnail: { w: 1920, h: 1080, build() {
    const s = world({ nest: [-9.8, 0, -11.2] }); sky(s, '#6fc3f0', '#d9f2fb');
    placeDragons(s, [2.5, 1.1, -0.5], 0.75, [-2.5, 1.1, -4.2], -0.35);
    const cam = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.5, 900);
    cam.position.set(14, 9.5, -27); cam.lookAt(-6, 4.2, 6);
    return [s, cam];
  } },
  // Square icon: the adult Fire dragon close up on its habitat, island and sea behind.
  Icon: { w: 1024, h: 1024, build() {
    const s = world({ volcano: false, far: true }); sky(s, '#4fb3ec', '#cfeefb');
    placeDragons(s, [0.6, 1.1, 0.4], 0.55);
    const cam = new THREE.PerspectiveCamera(32, 1, 0.5, 900);
    cam.position.set(3.4, 4.3, -11.2); cam.lookAt(-0.7, 3.5, 0.6);
    return [s, cam];
  } },
};
window.renderShot = (name) => {
  const shot = window.SHOTS[name];
  renderer.setSize(shot.w, shot.h);
  const [scene, cam] = shot.build();
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
